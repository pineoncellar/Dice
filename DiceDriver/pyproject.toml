[project]
name = "dicedriver"
version = "0.1.0"
description = "OneBot 11 host for the Dice! plugin DLL (w4123.Dice, x64)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dicedriver = "dicedriver.__main__:main"

[tool.setuptools]
packages = ["dicedriver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
