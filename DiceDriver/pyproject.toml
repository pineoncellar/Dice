[project]
name = "dicedriver"
dynamic = ["version"]
description = "OneBot 11 host for the Dice! plugin DLL (w4123.Dice, x64)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dicedriver = "dicedriver.__main__:main"

[tool.setuptools]
packages = ["dicedriver"]

# 版本号单一来源：dicedriver/__init__.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "dicedriver.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
